<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Demo Shop - AI Buyer Agent</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7;
    color: #1a1d23;
  }
  #root { max-width: 720px; margin: 0 auto; padding: 24px 16px; }

  .header { margin-bottom: 20px; }
  .header h1 { font-size: 20px; margin: 0 0 4px; }
  .session-info {
    font-size: 13px; color: #5b6270;
    background: #fff; border: 1px solid #e3e5e9; border-radius: 8px;
    padding: 10px 14px; display: flex; gap: 16px; flex-wrap: wrap;
  }

  .chat-window {
    background: #fff; border: 1px solid #e3e5e9; border-radius: 12px;
    height: 480px; overflow-y: auto; padding: 16px; margin: 16px 0;
    display: flex; flex-direction: column; gap: 12px;
  }

  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .bubble.user { align-self: flex-end; background: #2a5eff; color: #fff; border-bottom-right-radius: 4px; }
  .bubble.agent { align-self: flex-start; background: #eef0f4; color: #1a1d23; border-bottom-left-radius: 4px; }
  .route-tag {
    align-self: flex-start; font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
    text-transform: uppercase; color: #8a5cf6; margin-bottom: -4px;
  }

  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1; padding: 12px 14px; border: 1px solid #d7dae0; border-radius: 8px;
    font-size: 14px; outline: none;
  }
  .input-row input:focus { border-color: #2a5eff; }
  .input-row button {
    padding: 12px 20px; border: none; border-radius: 8px; background: #2a5eff;
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .input-row button:disabled { background: #b7c2e8; cursor: not-allowed; }

  .typing { font-size: 13px; color: #8a94a6; font-style: italic; padding: 0 4px; }
    .bubble.agent :is(p) { margin: 0 0 8px; }
  .bubble.agent :is(p:last-child) { margin-bottom: 0; }
  .bubble.agent strong { font-weight: 700; }
  .bubble.agent ul { margin: 4px 0; padding-left: 20px; }

  .trace-toggle {
    align-self: flex-start; font-size: 11px; color: #8a94a6; cursor: pointer;
    background: none; border: none; padding: 0; text-decoration: underline;
    margin-top: -6px;
  }
  .trace-box {
    align-self: flex-start; max-width: 90%; background: #1a1d23; color: #d6dae2;
    font-family: "SF Mono", Consolas, monospace; font-size: 12px; padding: 10px 12px;
    border-radius: 8px; white-space: pre-wrap; word-break: break-word;

    .layout { display: flex; gap: 20px; align-items: flex-start; }
  .chat-col { flex: 1; min-width: 0; }
  .audit-col {
    width: 320px; background: #fff; border: 1px solid #e3e5e9; border-radius: 12px;
    padding: 14px; max-height: 480px; overflow-y: auto; margin-top: 16px;
  }
  .audit-col h3 { margin: 0 0 10px; font-size: 14px; }
  .audit-entry {
    border-bottom: 1px solid #eef0f4; padding: 8px 0; font-size: 12px;
  }
  .audit-entry:last-child { border-bottom: none; }
  .audit-decision {
    display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase;
    padding: 1px 6px; border-radius: 4px; margin-bottom: 4px;
  }
  .audit-decision.allowed { background: #dcf5e3; color: #1a7d3c; }
  .audit-decision.blocked { background: #fde1e1; color: #b3261e; }
  .audit-decision.info { background: #e3ecfd; color: #1a54c4; }
  .audit-decision.error { background: #fde1e1; color: #b3261e; }
  .audit-explanation { color: #3a3f47; line-height: 1.4; }
  .audit-time { color: #a1a8b3; font-size: 10px; margin-top: 2px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function formatTrace(trace) {
  return trace.map(step => {
    if (step.type === "tool_call") {
      return `→ ${step.name}(${JSON.stringify(step.args)})`;
    }
    const content = typeof step.content === "string" ? step.content : JSON.stringify(step.content);
    const trimmed = content.length > 300 ? content.slice(0, 300) + "...[truncated]" : content;
    return `← ${trimmed}`;
  }).join("\n");
}

function AgentMessage({ content, route, trace }) {
  const [showTrace, setShowTrace] = useState(false);
  return (
    <React.Fragment>
      {route && <span className="route-tag">{route} agent</span>}
      <div className="bubble agent" dangerouslySetInnerHTML={{ __html: marked.parse(content) }} />
      {trace && trace.length > 0 && (
        <button className="trace-toggle" onClick={() => setShowTrace(s => !s)}>
          {showTrace ? "hide reasoning" : `show reasoning (${trace.length} steps)`}
        </button>
      )}
      {showTrace && <div className="trace-box">{formatTrace(trace)}</div>}
    </React.Fragment>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: 20, color: "#b00", fontFamily: "monospace", whiteSpace: "pre-wrap" }}>
          Something crashed: {String(this.state.error)}
          <br /><br />
          Check the browser console (F12) for the full stack trace.
        </div>
      );
    }
    return this.props.children;
  }
}

function AuditPanel({ sessionId }) {
  const [entries, setEntries] = useState([]);

  useEffect(() => {
    if (!sessionId) return;
    const poll = () => {
      fetch(`http://localhost:4000/audit-log?session_id=${sessionId}`)
        .then(r => r.json())
        .then(setEntries)
        .catch(() => {}); // silent - a missed poll tick isn't worth surfacing an error for
    };
    poll();
    const interval = setInterval(poll, 2000);
    return () => clearInterval(interval);
  }, [sessionId]);

  return (
    <div className="audit-col">
      <h3>🔍 Live Audit Trail</h3>
      {entries.length === 0 && <div style={{ fontSize: 12, color: "#a1a8b3" }}>No events yet.</div>}
      {entries.map(e => (
        <div key={e.id} className="audit-entry">
          <span className={`audit-decision ${e.decision}`}>{e.decision}</span>
          <div className="audit-explanation">{e.explanation}</div>
          <div className="audit-time">{new Date(e.timestamp).toLocaleTimeString()} · {e.tool_called}</div>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [conversationId, setConversationId] = useState(null);
  const [sessionInfo, setSessionInfo] = useState(null);
  const [messages, setMessages] = useState([]); // {role, content, route?, trace?}
  const [input, setInput] = useState("");
  const [sending, setSending] = useState(false);
  const chatWindowRef = useRef(null);

  useEffect(() => {
    fetch("/conversations", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ budget_rupees: 5000, confirmation_threshold_rupees: 1500 }),
    })
      .then(r => r.json())
      .then(data => {
        setConversationId(data.conversation_id);
        setSessionInfo(data);
      });
  }, []);

  useEffect(() => {
    if (chatWindowRef.current) {
      chatWindowRef.current.scrollTop = chatWindowRef.current.scrollHeight;
    }
  }, [messages, sending]);

  async function sendMessage() {
    const text = input.trim();
    if (!text || !conversationId || sending) return;

    setMessages(prev => [...prev, { role: "user", content: text }]);
    setInput("");
    setSending(true);

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversation_id: conversationId, message: text }),
      });
      const data = await res.json();
      setMessages(prev => [...prev, { role: "agent", content: data.reply, route: data.route, trace: data.trace }]);
    } catch (err) {
      setMessages(prev => [...prev, { role: "agent", content: "Something went wrong reaching the agent. Is the backend running?" }]);
    } finally {
      setSending(false);
    }
  }

  function handleKeyDown(e) {
    if (e.key === "Enter") sendMessage();
  }

  return (
    <div>
      <div className="header">
        <h1>🛍️ Demo Shop — AI Buyer Agent</h1>
        {sessionInfo && (
          <div className="session-info">
            <span>Budget: ₹{sessionInfo.budget_rupees.toFixed(2)}</span>
            <span>Confirmation above: ₹{sessionInfo.confirmation_threshold_rupees.toFixed(2)}</span>
            <span>Session: {sessionInfo.session_id.slice(0, 8)}...</span>
          </div>
        )}
      </div>
      <div className="layout">
      <div className="chat-col">

      <div className="chat-window" ref={chatWindowRef}>
        {messages.map((m, i) =>
          m.role === "user"
            ? <div key={i} className="bubble user">{m.content}</div>
            : <AgentMessage key={i} content={m.content} route={m.route} trace={m.trace} />
        )}
        {sending && <div className="typing">Agent is thinking...</div>}
      </div>

            <div className="input-row">
        <input
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={handleKeyDown}
          placeholder="Ask to buy something, or for a recommendation..."
          disabled={!conversationId}
        />
        <button onClick={sendMessage} disabled={!conversationId || sending}>Send</button>
      </div>

      </div>
      <AuditPanel sessionId={sessionInfo?.session_id} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
